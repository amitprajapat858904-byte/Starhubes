<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #eaf2ff;
            padding: 40px 15px;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 500px;
            margin: auto;
        }
        h1 { color: #155eef; }
        button {
            background: #155eef;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Welcome to Star Hub!</h1>
        <p>यह मेरी पहली वेबसाइट है।</p>
        <button onclick="alert('Welcome to Star Hub!')">
            Click Here
        </button>
    </div>
</body>
</html>
