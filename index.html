<header>
  <div class="top">
    <div class="logo" onclick="showSection('home')"><div class="logoMark">S</div><span>StarHubes</span></div>
    
    <div class="topNavLinks">
      <button class="active" data-section="home" onclick="showSection('home')">🏠 Home</button>
      <button data-section="apps" onclick="showSection('apps')">📱 App Store</button>
      <button data-section="news" onclick="showSection('news')">📰 News</button>
      <button data-section="jobs" onclick="showSection('jobs')">💼 Jobs</button>
      <button data-section="learning" onclick="showSection('learning')">🎓 Learning</button>
      <button data-section="books" onclick="showSection('books')">📚 Books</button>
      <button data-section="study" onclick="showSection('study')">👥 Study</button>
      <button data-section="community" onclick="showSection('community')">📍 Community</button>
    </div>

    <div class="search"><input id="searchInput" placeholder="खोजें..." oninput="filterVisible(this.value)"></div>
    <div class="topActions">
      <button class="ghost small" onclick="openSettingsModal()" title="Modern Settings & Bank">⚙️ Settings</button>
      <!-- Admin Panel Button: Strictly Hidden by default, shown ONLY for Amit Prajapat -->
      <button class="primary small hidden" id="adminPortalBtn" onclick="openAdminModal()" style="background:linear-gradient(110deg,#ffb020,#ff5252);">🛡️ Admin Panel</button>
      <button class="primary small" id="loginBtn" onclick="openAuth()">Login / OTP</button>
      <button class="ghost small hidden" id="logoutBtn" onclick="doLogout()">Logout</button>
      <div class="avatar" id="userAvatar" onclick="openAuth()" title="Account">S</div>
    </div>
  </div>
</header>
